<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manlift (Telescopic Boom) Inspection - Point to Point Structures Corp.</title>
  <style>
    /* =========================================
       1. MOBILE WEBFORM STYLES (SCREEN ONLY)
       ========================================= */
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f0f2f5;
      color: #111;
    }
    .form-card {
      max-width: 640px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .form-header {
      text-align: center;
      border-bottom: 2px solid #111;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .form-header img {
      max-height: 70px;
      width: auto;
      margin-bottom: 8px;
    }
    .form-header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.5px;
    }
    .form-header p {
      margin: 4px 0 0;
      font-weight: bold;
      color: #444;
    }
    .top-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (min-width: 500px) {
      .top-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .field-group {
      margin-bottom: 10px;
    }
    .field-group label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .field-group input,
    .field-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font-size: 15px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .section-title {
      background: #b5b5b5;
      color: #000;
      font-weight: bold;
      padding: 8px 12px;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 13px;
      border: 1px solid #000;
      text-transform: uppercase;
    }
    .check-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 10px 0;
    }
    .check-title {
      font-size: 14px;
      font-weight: 700;
      display: block;
    }
    .check-desc {
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 8px;
      display: block;
    }
    .radio-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .radio-option {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .radio-option input {
      width: 16px;
      height: 16px;
      margin: 0;
    }
    .radio-option:has(input:checked) {
      background: #e5e7eb;
      border-color: #111;
    }
    .defect-box {
      margin-top: 18px;
      padding: 14px;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    .defect-toggle {
      display: flex;
      gap: 12px;
      margin: 8px 0 12px;
    }
    .defect-toggle label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }
    .sig-wrapper {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 2px solid #111;
    }
    .sig-pad-box {
      border: 1.5px solid #111;
      border-radius: 6px;
      background: #fff;
      touch-action: none;
      margin-top: 4px;
    }
    canvas.sig-canvas {
      width: 100%;
      height: 120px;
      display: block;
    }
    .clear-btn {
      margin-top: 6px;
      padding: 6px 12px;
      background: #e5e7eb;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    .submit-btn:active {
      background: #333;
    }

    /* Hide PDF sheet on normal screen */
    #pdf-template {
      display: none;
    }

    /* =========================================
       2. PRINT / PDF LAYOUT (COMPACT 1-PAGE)
       ========================================= */
    @media print {
      @page {
        size: letter portrait;
        margin: 0.35in 0.45in;
      }
      body {
        background: #fff;
        padding: 0;
        margin: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .form-card {
        display: none;
      }
      #pdf-template {
        display: block;
        width: 100%;
        color: #000;
        font-family: Arial, Helvetica, sans-serif;
      }
      .pdf-header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #000;
        padding-bottom: 6px;
        margin-bottom: 8px;
      }
      .logo-box {
        text-align: center;
        margin-bottom: 8px;
      }
      .logo-box img {
        max-height: 70px;
        width: auto;
      }
      .doc-title {
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        text-align: right;
      }
      .top-meta-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 8px;
        font-size: 10px;
      }
      .top-meta-table td {
        border: 1px solid #000;
        padding: 4px 6px;
        width: 25%;
      }
      .top-meta-table span.lbl {
        font-weight: bold;
      }
      table.insp-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 7px;
        font-size: 9.5px;
      }
      table.insp-table th, table.insp-table td {
        border: 1px solid #000;
        padding: 2.2px 5px;
        line-height: 1.2;
      }
      .cat-header {
        background-color: #b5b5b5 !important;
        font-weight: bold;
        text-align: left;
        text-transform: uppercase;
        font-size: 10px;
      }
      .col-rating {
        background-color: #e5e5e5 !important;
        font-weight: bold;
        text-align: center;
        width: 7%;
        font-size: 9px;
      }
      .mark-cell {
        text-align: center;
        font-weight: bold;
        font-size: 11px;
      }
      .defect-pdf-box {
        border: 1px solid #000;
        padding: 5px 7px;
        margin-bottom: 8px;
        font-size: 10px;
      }
      .defect-pdf-header {
        font-weight: bold;
        margin-bottom: 3px;
      }
      .defect-pdf-text {
        min-height: 22px;
        white-space: pre-wrap;
      }
      .sig-pdf-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      .sig-pdf-table td {
        border: 1px solid #000;
        padding: 4px 6px;
        vertical-align: bottom;
      }
      .sig-img-slot {
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sig-img-slot img {
        max-height: 32px;
        max-width: 180px;
      }
      .pdf-footer {
        margin-top: 8px;
        font-size: 9.5px;
        color: #111;
        text-align: center;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================
       MOBILE INPUT FORM
       ========================================= -->
  <div class="form-card">
    <div class="form-header">
      <img src="logo.jpg" alt="Company Logo" onerror="this.style.display='none'">
      
      <p>MANLIFT INSPECTION</p>
    </div>

    <form id="manliftForm">
      <!-- Top Equipment Details -->
      <div class="top-grid">
        <div class="field-group">
          <label>Site</label>
          <input type="text" id="inSite" placeholder="Project / Site Name">
        </div>
        <div class="field-group">
          <label>Manlift Model</label>
          <input type="text" id="inModel" placeholder="e.g., JLG 600S / Genie S-65">
        </div>
        <div class="field-group">
          <label>Hour Meter Reading</label>
          <input type="number" step="0.1" id="inHours" placeholder="e.g., 1425.5">
        </div>
        <div class="field-group">
          <label>Fuel in Tank (Litres)</label>
          <input type="number" step="0.1" id="inFuel" placeholder="e.g., 85">
        </div>
      </div>

      <!-- Dynamic Checklist Container -->
      <div id="form-sections"></div>

      <!-- Defects Section -->
      <div class="defect-box">
        <label style="font-weight:bold; font-size:14px;">Defects Found?</label>
        <div class="defect-toggle">
          <label><input type="radio" name="defectsFound" value="No" checked> No</label>
          <label><input type="radio" name="defectsFound" value="Yes"> Yes</label>
        </div>
        <div class="field-group" style="margin-bottom:0;">
          <label>Defect Description</label>
          <textarea id="inDefectDesc" rows="3" placeholder="Describe any defects or tag-out actions taken..."></textarea>
        </div>
      </div>

      <!-- Sign-off Section -->
      <div class="sig-wrapper">
        <div class="field-group">
          <label>Date</label>
          <input type="date" id="inDate">
        </div>

        <div class="field-group">
          <label>Operator Name</label>
          <input type="text" id="inOperatorName" placeholder="Full Name">
        </div>
        <div class="field-group">
          <label>Operator Signature</label>
          <div class="sig-pad-box">
            <canvas id="sigOperator" class="sig-canvas"></canvas>
          </div>
          <button type="button" class="clear-btn" onclick="clearPad('sigOperator')">Clear Operator Signature</button>
        </div>

        <div class="field-group" style="margin-top:16px;">
          <label>Assisting Person Name</label>
          <input type="text" id="inAssistantName" placeholder="Full Name (if applicable)">
        </div>
        <div class="field-group">
          <label>Assisting Person Signature</label>
          <div class="sig-pad-box">
            <canvas id="sigAssistant" class="sig-canvas"></canvas>
          </div>
          <button type="button" class="clear-btn" onclick="clearPad('sigAssistant')">Clear Assisting Signature</button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Generate Inspection PDF</button>
    </form>
  </div>

  <!-- =========================================
       PRINT / PDF TEMPLATE
       ========================================= -->
  <div id="pdf-template">
    <div class="logo-box">
      <img src="logo.jpg" alt="Company Logo" onerror="this.outerHTML='<div style=\'display:inline-block;border:3px solid #000;padding:6px 14px;font-weight:900;font-size:22px;\'>POINT TO POINT STRUCTURES CORP.</div>'">
    </div>

      <div class="doc-title">MANLIFT (TELESCOPIC BOOM)<br>PRE-USE INSPECTION</div>
    

    <table class="top-meta-table">
      <tr>
        <td><span class="lbl">Site:</span> <span id="outSite"></span></td>
        <td><span class="lbl">Manlift Model:</span> <span id="outModel"></span></td>
        <td><span class="lbl">Hour Meter:</span> <span id="outHours"></span></td>
        <td><span class="lbl">Fuel (Litres):</span> <span id="outFuel"></span></td>
      </tr>
    </table>

    <!-- Checklist Tables rendered by JS -->
    <div id="pdf-tables"></div>

    <!-- Defects Box -->
    <div class="defect-pdf-box">
      <div class="defect-pdf-header">Defects Found? &nbsp; <span id="outDefectsFound">No</span></div>
      <div class="defect-pdf-text"><span style="font-weight:bold;">Defect Description:</span> <span id="outDefectDesc"></span></div>
    </div>

    <!-- Signatures & Date -->
    <table class="sig-pdf-table">
      <tr>
        <td style="width:38%;"><span style="font-weight:bold;">Operator Name:</span> <span id="outOperatorName"></span></td>
        <td style="width:42%;">
          <div style="font-weight:bold; font-size:9px;">Operator Signature:</div>
          <div class="sig-img-slot"><img id="outOperatorSig" src="" alt=""></div>
        </td>
        <td style="width:20%;" rowspan="2" style="vertical-align:top;">
          <div style="font-weight:bold;">Date:</div>
          <div id="outDate" style="margin-top:6px; font-weight:bold;"></div>
        </td>
      </tr>
      <tr>
        <td><span style="font-weight:bold;">Assisting Person:</span> <span id="outAssistantName"></span></td>
        <td>
          <div style="font-weight:bold; font-size:9px;">Assisting Person Signature:</div>
          <div class="sig-img-slot"><img id="outAssistantSig" src="" alt=""></div>
        </td>
      </tr>
    </table>

    <div class="pdf-footer">
      3250 46th Ave SE &nbsp;Calgary, AB &nbsp;T2B 3K7 &nbsp;(587) 328-0007
    </div>
  </div>

  <script>
    // Streamlined Telescopic Boom Checklist (Tailored to boom lifts with Pass / Fail / N/A)
    const sections = [
      {
        title: "1. Power-Off Visual Inspection",
        items: [
          { name: "Manuals & Decals", desc: "Operator's manual inside weather-resistant box; all safety decals legible." },
          { name: "Annual Inspection", desc: "Current annual inspection sticker or tag is present and valid." },
          { name: "Wheels & Tires", desc: "Free of cuts, chunks, or excessive wear; lug nuts tight; air pressure OK." },
          { name: "Fluid Levels & Leaks", desc: "Engine oil, hydraulic fluid, and coolant at proper levels; no leaks underneath." },
          { name: "Battery / Power System", desc: "Terminals clean and tight, cables undamaged, fuel or charge sufficient." },
          { name: "Hydraulics & Hoses", desc: "Hoses, fittings, and cylinders free of abrasion, pinching, or leaks." },
          { name: "Structural Integrity", desc: "Telescopic boom, chassis, and welds free of cracks, dents, bends, or corrosion." },
          { name: "Fasteners & Pins", desc: "All pivot pins, retaining bolts, and compartment latches secure." },
          { name: "Guardrails & Platform", desc: "Floor clean and dry; guardrails, mid-rails, toe boards, and entry gate secure." },
          { name: "Fall Protection Anchors", desc: "Lanyard anchorage points intact and free of damage." },
          { name: "Outriggers / Axle Extensions", desc: "Outriggers, pads, extending axles, and interlocks undamaged (if equipped)." }
        ]
      },
      {
        title: "2. Power-On Functional Inspection",
        items: [
          { name: "Ground Controls", desc: "Lower switches, joysticks, and key switch operate smoothly and return to neutral." },
          { name: "Emergency Stop (Ground)", desc: "Red E-stop cuts all power and stops machine functions immediately." },
          { name: "Platform Controls", desc: "Upper drive, steer, boom lift/extend/swing and foot pedal operate smoothly." },
          { name: "Emergency Stop (Platform)", desc: "Upper E-stop halts all operations when engaged." },
          { name: "Emergency Lowering", desc: "Auxiliary/emergency lowering system operates properly from the ground." },
          { name: "Brakes & Steering", desc: "Drive and steer respond accurately; brakes hold when controls are released." },
          { name: "Alarms, Horn & Lights", desc: "Horn, motion/descent alarms, flashing beacons, and tilt/slope alarms work." }
        ]
      },
      {
        title: "3. Worksite Hazard Assessment",
        items: [
          { name: "Ground Conditions", desc: "Surface level, firm, and free of drop-offs, holes, debris, or obstructions." },
          { name: "Overhead Obstructions", desc: "Path of travel and boom elevation clear of beams, rafters, pipes, and ceilings." },
          { name: "Electrical Hazards", desc: "Minimum safe clearance (at least 10 ft / 3 m+) maintained from power lines." },
          { name: "Weather Conditions", desc: "Wind speeds and weather within manufacturer's safe operating limits." },
          { name: "Traffic & Pedestrians", desc: "Work zone barricaded or spotted to protect against vehicles and foot traffic." }
        ]
      }
    ];

    const ratings = ["PASS", "FAIL", "N/A"];
    const formContainer = document.getElementById("form-sections");

    // 1. Build Mobile Form Questions
    sections.forEach((sec, sIdx) => {
      const secHeader = document.createElement("div");
      secHeader.className = "section-title";
      secHeader.textContent = sec.title;
      formContainer.appendChild(secHeader);

      sec.items.forEach((item, iIdx) => {
        const fieldName = `q_${sIdx}_${iIdx}`;
        const itemDiv = document.createElement("div");
        itemDiv.className = "check-item";

        let radiosHTML = `<div class="radio-group">`;
        ratings.forEach((rate) => {
          radiosHTML += `
            <label class="radio-option">
              <input type="radio" name="${fieldName}" value="${rate}">
              ${rate}
            </label>
          `;
        });
        radiosHTML += `</div>`;

        itemDiv.innerHTML = `
          <span class="check-title">${item.name}</span>
          <span class="check-desc">${item.desc}</span>
          ${radiosHTML}
        `;
        formContainer.appendChild(itemDiv);
      });
    });

    // Auto-fill today's date
    document.getElementById("inDate").valueAsDate = new Date();

    // 2. Signature Pad Setup (Supports Multiple Pads)
    const pads = {};

    function initSignaturePad(canvasId) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext("2d");
      let drawing = false;
      let hasInk = false;

      function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.getBoundingClientRect();
        if (rect.width > 0) {
          canvas.width = rect.width * ratio;
          canvas.height = rect.height * ratio;
          ctx.scale(ratio, ratio);
          ctx.lineWidth = 2.2;
          ctx.lineCap = "round";
          ctx.strokeStyle = "#000";
        }
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        drawing = true;
        hasInk = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!drawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function endDraw() {
        drawing = false;
      }

      canvas.addEventListener("mousedown", startDraw);
      canvas.addEventListener("mousemove", draw);
      window.addEventListener("mouseup", endDraw);

      canvas.addEventListener("touchstart", startDraw, { passive: false });
      canvas.addEventListener("touchmove", draw, { passive: false });
      canvas.addEventListener("touchend", endDraw);

      pads[canvasId] = {
        clear: () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          hasInk = false;
        },
        isEmpty: () => !hasInk,
        toDataURL: () => canvas.toDataURL("image/png")
      };
    }

    initSignaturePad("sigOperator");
    initSignaturePad("sigAssistant");

    function clearPad(id) {
      if (pads[id]) pads[id].clear();
    }

    // 3. Generate PDF Layout on Submit
    document.getElementById("manliftForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const site = document.getElementById("inSite").value.trim();
      const model = document.getElementById("inModel").value.trim();
      const hours = document.getElementById("inHours").value.trim();
      const fuel = document.getElementById("inFuel").value.trim();
      const inspDate = document.getElementById("inDate").value;

      document.getElementById("outSite").textContent = site;
      document.getElementById("outModel").textContent = model;
      document.getElementById("outHours").textContent = hours;
      document.getElementById("outFuel").textContent = fuel ? `${fuel} L` : "";
      document.getElementById("outDate").textContent = inspDate;

      // Render Checklist Tables
      const pdfTablesDiv = document.getElementById("pdf-tables");
      pdfTablesDiv.innerHTML = "";

      sections.forEach((sec, sIdx) => {
        let tableHTML = `
          <table class="insp-table">
            <tr>
              <th class="cat-header">${sec.title}</th>
              <th class="col-rating">PASS</th>
              <th class="col-rating">FAIL</th>
              <th class="col-rating">N/A</th>
            </tr>
        `;

        sec.items.forEach((item, iIdx) => {
          const checkedEl = document.querySelector(`input[name="q_${sIdx}_${iIdx}"]:checked`);
          const selected = checkedEl ? checkedEl.value : "";

          tableHTML += `<tr><td><strong>${item.name}:</strong> ${item.desc}</td>`;
          ratings.forEach((rate) => {
            tableHTML += `<td class="mark-cell">${selected === rate ? "&#10003;" : ""}</td>`;
          });
          tableHTML += `</tr>`;
        });

        tableHTML += `</table>`;
        pdfTablesDiv.innerHTML += tableHTML;
      });

      // Defects
      const defectRadio = document.querySelector('input[name="defectsFound"]:checked');
      document.getElementById("outDefectsFound").textContent = defectRadio ? defectRadio.value : "No";
      document.getElementById("outDefectDesc").textContent = document.getElementById("inDefectDesc").value.trim();

      // Signatures & Names
      document.getElementById("outOperatorName").textContent = document.getElementById("inOperatorName").value.trim();
      document.getElementById("outAssistantName").textContent = document.getElementById("inAssistantName").value.trim();

      const opSigImg = document.getElementById("outOperatorSig");
      if (!pads["sigOperator"].isEmpty()) {
        opSigImg.src = pads["sigOperator"].toDataURL();
        opSigImg.style.display = "block";
      } else {
        opSigImg.style.display = "none";
      }

      const asstSigImg = document.getElementById("outAssistantSig");
      if (!pads["sigAssistant"].isEmpty()) {
        asstSigImg.src = pads["sigAssistant"].toDataURL();
        asstSigImg.style.display = "block";
      } else {
        asstSigImg.style.display = "none";
      }

      // Set Filename
      const cleanModel = model.replace(/[^a-zA-Z0-9_-]/g, "_");
      document.title = `Manlift_Inspection_${cleanModel || "Report"}_${inspDate || "Draft"}`;

      window.print();
    });
  </script>
</body>
</html>
